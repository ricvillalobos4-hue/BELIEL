<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELIAL | Del Alba al Abismo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuentes tipográficas Cinzel, Inter y Permanent Marker para estilo graffiti -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@300;400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-rgb: 255, 255, 255;
            --text-rgb: 0, 0, 0;
            --scroll-fraction: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(var(--bg-rgb));
            color: rgb(var(--text-rgb));
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.05s linear, color 0.05s linear;
        }

        .font-display {
            font-family: 'Cinzel', serif;
        }

        /* Estilo de tipografía graffiti urbano */
        .font-graffiti {
            font-family: 'Permanent Marker', cursive;
        }

        /* Contenedor de la Estatua Fotográfica de Fondo */
        #statue-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            pointer-events: none;
            z-index: 2;
            opacity: 0.25;
            transition: opacity 0.3s ease;
            mix-blend-mode: luminosity;
        }

        #statue-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            filter: contrast(130%) grayscale(40%);
        }

        /* Capa de grafitis digitales superpuestos sobre la foto */
        .graffiti-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 50% 40%, rgba(220, 38, 38, 0.35) 0%, transparent 60%),
                              radial-gradient(circle at 40% 70%, rgba(59, 130, 246, 0.3) 0%, transparent 50%);
            mix-blend-mode: color-burn;
        }

        /* Lienzo de humo y partículas fijo */
        #ash-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 3;
        }

        /* Elementos por encima del fondo */
        nav, main, footer {
            position: relative;
            z-index: 10;
        }

        /* Menú lateral de navegación con pantalla completa */
        #menu-overlay {
            background: rgba(10, 10, 12, 0.97);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .menu-open {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <!-- Estatua de la Libertad Fotográfica con Vandalismo de Fondo -->
    <div id="statue-container">
        <img src="https://images.unsplash.com/photo-1534430480872-3498386e7856?auto=format&fit=crop&w=1200&q=80" alt="Estatua de la Libertad" onerror="this.src='https://placehold.co/800x1000/cccccc/333333?text=BELIAL+Statue'">
        <div class="graffiti-overlay"></div>
    </div>

    <!-- Canvas de Humo Ascendente -->
    <canvas id="ash-canvas"></canvas>

    <!-- Barra de Navegación Fija -->
    <header>
        <nav class="fixed top-0 left-0 w-full px-6 md:px-12 py-6 grid grid-cols-3 items-center z-50">
            <div></div>
            <div class="text-center">
                <a href="#inicio" class="font-display text-lg md:text-2xl font-black tracking-[0.35em] uppercase hover:opacity-75 transition-opacity inline-block">
                    BELIAL
                </a>
            </div>
            <div class="flex justify-end items-center">
                <button id="menu-toggle" aria-label="Abrir menú" class="p-2.5 rounded-lg focus:outline-none group cursor-pointer border border-current/20 bg-[rgb(var(--bg-rgb))]/40 backdrop-blur-sm transition-colors">
                    <div class="w-6 flex flex-col items-end gap-1">
                        <span id="line-1" class="block h-[2px] w-6 bg-current transition-all duration-300"></span>
                        <span id="line-2" class="block h-[2px] w-4 group-hover:w-6 bg-current transition-all duration-300"></span>
                        <span id="line-3" class="block h-[2px] w-6 bg-current transition-all duration-300"></span>
                    </div>
                </button>
            </div>
        </nav>
    </header>

    <!-- Menú Desplegable Pantalla Completa -->
    <div id="menu-overlay" class="fixed inset-0 z-40 flex flex-col justify-center items-center opacity-0 invisible pointer-events-none text-white">
        <div class="flex flex-col items-center space-y-8 text-center">
            <span class="text-xs tracking-[0.5em] uppercase text-red-500 font-semibold mb-2">Índice</span>
            <a href="#inicio" class="menu-link font-display text-3xl md:text-5xl tracking-[0.25em] uppercase hover:text-red-500 transition-colors">Inicio</a>
            <a href="#abismo" class="menu-link font-display text-3xl md:text-5xl tracking-[0.25em] uppercase hover:text-red-500 transition-colors">Abismo</a>
            
            <!-- Icono de Instagram en el menú -->
            <div class="pt-4">
                <a href="https://instagram.com/soy_villa19" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-12 h-12 rounded-full border border-white/20 hover:border-red-500 hover:text-red-500 transition-all text-xl" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
        </div>
        <div class="absolute bottom-12 text-[11px] tracking-[0.35em] uppercase opacity-40 text-white">
            BELIAL • VILLA X PILLO
        </div>
    </div>

    <!-- Contenido Principal -->
    <main>
        <!-- SECCIÓN 1: INICIO -->
        <section id="inicio" class="min-h-screen flex flex-col justify-center items-center px-6 text-center relative">
            <div class="max-w-4xl mx-auto">
                <span class="text-xs md:text-sm uppercase tracking-[0.45em] opacity-60 block mb-4 font-medium">
                    Capítulo I • El Alba
                </span>
                <h1 class="font-display text-6xl sm:text-8xl md:text-9xl font-black tracking-[0.2em] md:tracking-[0.25em] uppercase mb-4 select-none">
                    BELIAL
                </h1>
                <p class="font-graffiti text-2xl sm:text-3xl md:text-4xl tracking-wider text-red-600 transform -rotate-2 select-none drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">
                    VILLA X PILLO
                </p>
            </div>
        </section>

        <!-- SECCIÓN 2: ABISMO (Capítulo II) -->
        <section id="abismo" class="min-h-screen flex flex-col justify-center items-center px-6 py-24 text-center relative">
            <div class="max-w-3xl mx-auto">
                <span class="text-xs md:text-sm uppercase tracking-[0.5em] text-red-500 font-semibold block mb-4">
                    Capítulo II • Próximamente
                </span>
                <h2 id="abyss-title" class="font-display text-4xl sm:text-6xl md:text-7xl font-black tracking-[0.2em] uppercase mb-10 transition-all duration-300">
                    La Oscuridad
                </h2>

                <div class="flex justify-center items-center">
                    <a href="#inicio" class="px-8 py-4 rounded-xl text-xs sm:text-sm tracking-[0.25em] uppercase opacity-70 hover:opacity-100 transition-opacity border border-current/30">
                        ↑ Volver al Alba
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="py-10 px-6 text-center border-t border-current/10 flex flex-col items-center justify-center gap-4 text-xs tracking-[0.25em] uppercase opacity-60">
        <a href="https://instagram.com/soy_villa19" target="_blank" rel="noopener noreferrer" class="hover:opacity-100 transition-opacity text-base mb-1" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <span>&copy; 2026 Belial.Villalobos</span>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        let scrollFraction = 0;

        const abyssTitle = document.getElementById('abyss-title');
        const statueContainer = document.getElementById('statue-container');

        // Control del menú desplegable
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.getElementById('menu-overlay');
        const line1 = document.getElementById('line-1');
        const line2 = document.getElementById('line-2');
        const line3 = document.getElementById('line-3');
        const menuLinks = document.querySelectorAll('.menu-link');
        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                menuOverlay.classList.add('menu-open');
                line1.style.transform = 'translateY(7px) rotate(45deg)';
                line2.style.opacity = '0';
                line3.style.transform = 'translateY(-7px) rotate(-45deg)';
            } else {
                menuOverlay.classList.remove('menu-open');
                line1.style.transform = 'none';
                line2.style.opacity = '1';
                line3.style.transform = 'none';
            }
        }

        menuToggle.addEventListener('click', toggleMenu);
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (isMenuOpen) toggleMenu();
            });
        });

        // Actualización dinámica de colores y opacidad de la estatua
        function updateScrollTheme() {
            const scrollTop = window.scrollY;
            const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);

            scrollFraction = Math.max(0, Math.min(1, scrollTop / maxScroll));

            const bgVal = Math.round(255 * (1 - scrollFraction));
            const textVal = Math.round(255 * scrollFraction);

            document.documentElement.style.setProperty('--bg-rgb', `${bgVal}, ${bgVal}, ${bgVal}`);
            document.documentElement.style.setProperty('--text-rgb', `${textVal}, ${textVal}, ${textVal}`);
            document.documentElement.style.setProperty('--scroll-fraction', scrollFraction.toFixed(3));

            if (scrollFraction < 0.5) {
                statueContainer.style.opacity = 0.25 + (scrollFraction * 0.25);
            } else {
                statueContainer.style.opacity = Math.max(0, 0.5 - ((scrollFraction - 0.5) * 0.8));
            }

            if (scrollFraction > 0.75) {
                const intensity = (scrollFraction - 0.75) * 4;
                abyssTitle.style.textShadow = `0 0 ${Math.round(30 * intensity)}px rgba(220, 38, 38, ${0.6 * intensity})`;
            } else {
                abyssTitle.style.textShadow = 'none';
            }
        }

        window.addEventListener('scroll', updateScrollTheme, { passive: true });

        // Motor de Humo Ascendente en Canvas
        const canvas = document.getElementById('ash-canvas');
        const ctx = canvas.getContext('2d');
        let smokePlumes = [];
        const SMOKE_COUNT = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        class SmokePuff {
            constructor(initialRandom = true) {
                this.reset(initialRandom);
            }

            reset(initialRandom = false) {
                this.x = Math.random() * canvas.width;
                this.baseRadius = Math.random() * 90 + 60;
                this.radius = this.baseRadius;
                this.y = initialRandom 
                    ? canvas.height - (Math.random() * canvas.height * 0.85)
                    : canvas.height + this.radius * 0.6;

                this.speedY = Math.random() * 1.1 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.turbulence = Math.random() * Math.PI * 2;
                this.turbulenceSpeed = Math.random() * 0.012 + 0.005;

                this.life = initialRandom ? Math.random() * 0.6 : 0;
                this.maxLife = 1;
                this.lifeSpeed = Math.random() * 0.003 + 0.002;
                this.maxAlpha = Math.random() * 0.16 + 0.08;
                this.hasCrimsonTint = Math.random() < 0.4;
            }

            update() {
                this.turbulence += this.turbulenceSpeed;
                this.life += this.lifeSpeed;

                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.turbulence) * 0.8;
                this.radius = this.baseRadius + (this.life * 95);

                if (this.life >= this.maxLife || this.y < -this.radius) {
                    this.reset(false);
                }
            }

            draw() {
                const fade = Math.sin(this.life * Math.PI);
                const currentAlpha = Math.max(0, fade * this.maxAlpha);

                if (currentAlpha <= 0.002) return;

                const lightR = 40, lightG = 40, lightB = 45;
                const darkR = this.hasCrimsonTint ? 210 : 170;
                const darkG = this.hasCrimsonTint ? 40  : 170;
                const darkB = this.hasCrimsonTint ? 40  : 180;

                const r = Math.round(lightR + (darkR - lightR) * scrollFraction);
                const g = Math.round(lightG + (darkG - lightG) * scrollFraction);
                const b = Math.round(lightB + (darkB - lightB) * scrollFraction);

                const grad = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${currentAlpha})`);
                grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${currentAlpha * 0.4})`);
                grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initSmoke() {
            smokePlumes = [];
            for (let i = 0; i < SMOKE_COUNT; i++) {
                smokePlumes.push(new SmokePuff(true));
            }
        }

        function animateSmoke() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < smokePlumes.length; i++) {
                smokePlumes[i].update();
                smokePlumes[i].draw();
            }

            requestAnimationFrame(animateSmoke);
        }

        window.onload = function () {
            resizeCanvas();
            updateScrollTheme();
            initSmoke();
            animateSmoke();
        };
    </script>
</body>
</html>
